[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate"
version = "0.1.0"
description = "Merge gate for AI-agent-generated changes: batched, tested, risk-tiered, provenance-tagged."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
gate = "gate:main"

[tool.setuptools]
py-modules = ["gate"]
