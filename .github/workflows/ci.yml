name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install ruff mypy coverage
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy gate.py
      - name: Coverage (fails under 85%)
        run: |
          coverage run -m unittest test_gate
          coverage report

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # gate needs git >= 2.40 (merge-tree --merge-base); Apple's bundled git can be older.
      - name: Newer git on macOS
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Git identity
        run: |
          git --version
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main

      - name: Unit + end-to-end tests
        run: python -m unittest -v test_gate

      - name: Demo
        run: python demo.py

      - name: Throughput benchmark (small)
        run: python bench.py --sessions 48 --lanes 4 --test-seconds 1 --batch 4
